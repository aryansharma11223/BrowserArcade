<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12131C"/>
      <stop offset="100%" stop-color="#090A0F"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  
  <!-- Arcade D-Pad & Buttons Graphic -->
  <g filter="url(#glow)">
    <!-- Arcade Cabinet / Controller Silhouette -->
    <path d="M16 28 C16 20, 22 16, 32 16 C42 16, 48 20, 48 28 L46 44 C46 47, 43 49, 40 47 L35 43 L29 43 L24 47 C21 49, 18 47, 18 44 Z" fill="url(#primaryGrad)"/>
    <!-- Directional Pad -->
    <rect x="22" y="26" width="4" height="10" rx="1" fill="#FFFFFF" opacity="0.95"/>
    <rect x="19" y="29" width="10" height="4" rx="1" fill="#FFFFFF" opacity="0.95"/>
    <!-- Action Buttons -->
    <circle cx="39" cy="28" r="2.2" fill="#FFFFFF" opacity="0.95"/>
    <circle cx="43" cy="32" r="2.2" fill="#FFFFFF" opacity="0.95"/>
  </g>
</svg>
