<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" width="400" height="225">
  <defs>
    <linearGradient id="bgSnake" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1917"/>
      <stop offset="100%" stop-color="#060c0c"/>
    </linearGradient>
    <linearGradient id="snakeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="400" height="225" fill="url(#bgSnake)"/>
  
  <!-- Subtle Grid -->
  <g opacity="0.06" stroke="#10B981" stroke-width="1">
    <line x1="0" y1="45" x2="400" y2="45"/><line x1="0" y1="90" x2="400" y2="90"/>
    <line x1="0" y1="135" x2="400" y2="135"/><line x1="0" y1="180" x2="400" y2="180"/>
    <line x1="80" y1="0" x2="80" y2="225"/><line x1="160" y1="0" x2="160" y2="225"/>
    <line x1="240" y1="0" x2="240" y2="225"/><line x1="320" y1="0" x2="320" y2="225"/>
  </g>

  <!-- Glowing Food Pellet -->
  <circle cx="280" cy="112" r="10" fill="#EF4444" filter="url(#neonGlow)"/>
  <circle cx="280" cy="112" r="5" fill="#FFFFFF"/>

  <!-- Neon Snake Segments -->
  <g filter="url(#neonGlow)">
    <rect x="80" y="145" width="28" height="28" rx="6" fill="#10B981" opacity="0.6"/>
    <rect x="112" y="145" width="28" height="28" rx="6" fill="#10B981" opacity="0.7"/>
    <rect x="144" y="145" width="28" height="28" rx="6" fill="#10B981" opacity="0.8"/>
    <rect x="144" y="113" width="28" height="28" rx="6" fill="#10B981" opacity="0.9"/>
    <rect x="176" y="113" width="28" height="28" rx="6" fill="url(#snakeGrad)"/>
    <rect x="208" y="113" width="28" height="28" rx="6" fill="url(#snakeGrad)"/>
    <!-- Snake Head -->
    <rect x="240" y="113" width="28" height="28" rx="8" fill="#06B6D4"/>
    <circle cx="258" cy="120" r="3" fill="#090A10"/>
    <circle cx="258" cy="134" r="3" fill="#090A10"/>
  </g>
</svg>
