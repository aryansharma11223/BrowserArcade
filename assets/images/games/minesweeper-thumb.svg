<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" width="400" height="225">
  <defs>
    <linearGradient id="bgMine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181c2b"/>
      <stop offset="100%" stop-color="#0e1018"/>
    </linearGradient>
    <filter id="flagGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="400" height="225" fill="url(#bgMine)"/>

  <!-- 3x3 Grid Matrix in center -->
  <g transform="translate(115, 30)">
    <!-- Row 1 -->
    <rect x="0" y="0" width="50" height="50" rx="8" fill="#242b40" stroke="rgba(255,255,255,0.06)"/>
    <text x="25" y="34" font-family="system-ui, sans-serif" font-weight="800" font-size="24" fill="#3B82F6" text-anchor="middle">1</text>

    <rect x="60" y="0" width="50" height="50" rx="8" fill="#242b40" stroke="rgba(255,255,255,0.06)"/>
    <text x="85" y="34" font-family="system-ui, sans-serif" font-weight="800" font-size="24" fill="#10B981" text-anchor="middle">2</text>

    <!-- Flagged Tile -->
    <rect x="120" y="0" width="50" height="50" rx="8" fill="#1e2436" stroke="rgba(255,255,255,0.1)"/>
    <g filter="url(#flagGlow)" transform="translate(133, 12)">
      <polygon points="0,0 18,7 0,14" fill="#EF4444"/>
      <line x1="0" y1="0" x2="0" y2="26" stroke="#94A3B8" stroke-width="2"/>
      <line x1="-5" y1="26" x2="6" y2="26" stroke="#94A3B8" stroke-width="2.5"/>
    </g>

    <!-- Row 2 -->
    <rect x="0" y="60" width="50" height="50" rx="8" fill="#242b40" stroke="rgba(255,255,255,0.06)"/>
    <text x="25" y="94" font-family="system-ui, sans-serif" font-weight="800" font-size="24" fill="#EF4444" text-anchor="middle">3</text>

    <!-- Mine Icon -->
    <rect x="60" y="60" width="50" height="50" rx="8" fill="#331824" stroke="#EF4444" stroke-width="1.5"/>
    <circle cx="85" cy="85" r="11" fill="#EF4444"/>
    <line x1="71" y1="85" x2="99" y2="85" stroke="#EF4444" stroke-width="3"/>
    <line x1="85" y1="71" x2="85" y2="99" stroke="#EF4444" stroke-width="3"/>
    <line x1="75" y1="75" x2="95" y2="95" stroke="#EF4444" stroke-width="2.5"/>
    <line x1="75" y1="95" x2="95" y2="75" stroke="#EF4444" stroke-width="2.5"/>
    <circle cx="82" cy="82" r="2.5" fill="#FFFFFF"/>

    <rect x="120" y="60" width="50" height="50" rx="8" fill="#242b40" stroke="rgba(255,255,255,0.06)"/>
    <text x="145" y="94" font-family="system-ui, sans-serif" font-weight="800" font-size="24" fill="#3B82F6" text-anchor="middle">1</text>

    <!-- Row 3 -->
    <rect x="0" y="120" width="50" height="50" rx="8" fill="#1a1e2e" opacity="0.6"/>
    <rect x="60" y="120" width="50" height="50" rx="8" fill="#1a1e2e" opacity="0.6"/>
    <rect x="120" y="120" width="50" height="50" rx="8" fill="#1a1e2e" opacity="0.6"/>
  </g>
</svg>
