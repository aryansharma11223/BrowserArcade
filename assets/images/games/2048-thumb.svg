<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" width="400" height="225">
  <defs>
    <linearGradient id="bg2048" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161826"/>
      <stop offset="100%" stop-color="#0e101a"/>
    </linearGradient>
    <linearGradient id="tileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <filter id="tileGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="400" height="225" fill="url(#bg2048)"/>
  
  <!-- Subtle Grid Lines -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1.5">
    <line x1="0" y1="56" x2="400" y2="56"/>
    <line x1="0" y1="112" x2="400" y2="112"/>
    <line x1="0" y1="168" x2="400" y2="168"/>
    <line x1="100" y1="0" x2="100" y2="225"/>
    <line x1="200" y1="0" x2="200" y2="225"/>
    <line x1="300" y1="0" x2="300" y2="225"/>
  </g>

  <!-- Isometric / Floating 2048 Tiles -->
  <!-- Tile 128 -->
  <rect x="75" y="65" width="65" height="65" rx="10" fill="#EAB308" opacity="0.9"/>
  <text x="107" y="106" font-family="system-ui, sans-serif" font-weight="800" font-size="22" fill="#0F172A" text-anchor="middle">128</text>

  <!-- Tile 512 -->
  <rect x="155" y="45" width="75" height="75" rx="12" fill="#10B981" opacity="0.95"/>
  <text x="192" y="93" font-family="system-ui, sans-serif" font-weight="800" font-size="26" fill="#FFFFFF" text-anchor="middle">512</text>

  <!-- Hero Tile 2048 with Glow -->
  <g filter="url(#tileGlow)">
    <rect x="245" y="65" width="85" height="85" rx="14" fill="url(#tileGrad)"/>
    <text x="287" y="119" font-family="system-ui, sans-serif" font-weight="900" font-size="30" fill="#FFFFFF" text-anchor="middle" letter-spacing="-1">2048</text>
  </g>

  <!-- Decorative Sparkles -->
  <circle cx="340" cy="55" r="3" fill="#EC4899" opacity="0.8"/>
  <circle cx="65" cy="145" r="2.5" fill="#6366F1" opacity="0.8"/>
  <circle cx="230" cy="165" r="3" fill="#EAB308" opacity="0.8"/>
</svg>
